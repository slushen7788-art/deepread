<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290">
<rect width="880" height="290" fill="#fdf6ec"/>
<g font-family="sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#888"/></marker></defs><rect x="40" y="30" width="360" height="64" rx="10" fill="#ffffff" stroke="#bbb"/><text x="220" y="58" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">提交当前历史给模型</text><text x="220" y="80" font-size="13" text-anchor="middle" fill="#555">含已缓存前缀 + 新增内容</text><line x1="400" y1="62" x2="440" y2="62" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="30" width="360" height="64" rx="10" fill="#ffffff" stroke="#bbb"/><text x="620" y="58" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">模型返回工具调用请求</text><text x="620" y="80" font-size="13" text-anchor="middle" fill="#555">按名 + 参数</text><line x1="620" y1="94" x2="620" y2="118" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="118" width="360" height="64" rx="10" fill="#ffffff" stroke="#bbb"/><text x="620" y="146" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">应用执行对应工具</text><text x="620" y="168" font-size="13" text-anchor="middle" fill="#555">服务端授权、参数校验在这里</text><line x1="440" y1="150" x2="400" y2="150" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="118" width="360" height="64" rx="10" fill="#d8ecff" stroke="#6a9fd8"/><text x="220" y="146" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">追加输出与工具结果</text><text x="220" y="168" font-size="13" text-anchor="middle" fill="#555">新断点标记，旧断点全部保留</text><line x1="220" y1="182" x2="220" y2="206" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="230" font-size="14" text-anchor="middle" fill="#333">回到提交，直到模型返回最终答案</text><text x="440" y="262" font-size="14" text-anchor="middle" fill="#8a6d3b">只移动单个断点、丢掉旧断点 → 原缓存无法复用，造成重复写入</text></g>
</svg>