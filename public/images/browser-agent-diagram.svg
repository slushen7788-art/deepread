<svg viewBox="0 0 720 486" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Browser Agent 核心机制图" style="width:100%;height:auto;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <text x="20" y="22" font-size="13" fill="#a39e8f" letter-spacing="2">核心循环 · Harness 驱动，模型只负责判断</text>

  <!-- 循环四框 -->
  <g font-size="15" fill="#1d1d1f" text-anchor="middle">
    <rect x="20" y="36" width="140" height="58" rx="10" fill="#fff" stroke="#d8d2c4" stroke-width="1.5"/>
    <text x="90" y="61">观察页面</text>
    <text x="90" y="82" font-size="12" fill="#8a8578">每轮新鲜状态</text>

    <rect x="205" y="36" width="130" height="58" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="2"/>
    <text x="270" y="61" font-weight="600">模型选动作</text>
    <text x="270" y="82" font-size="12" fill="#8a8578">唯一的判断点</text>

    <rect x="380" y="36" width="140" height="58" rx="10" fill="#fff" stroke="#d8d2c4" stroke-width="1.5"/>
    <text x="450" y="61">执行动作</text>
    <text x="450" y="82" font-size="12" fill="#8a8578">经 CDP 控制浏览器</text>

    <rect x="565" y="36" width="135" height="58" rx="10" fill="#fff" stroke="#d8d2c4" stroke-width="1.5"/>
    <text x="632" y="61">检查结果</text>
    <text x="632" y="82" font-size="12" fill="#8a8578">达成目标了吗</text>
  </g>
  <line x1="162" y1="65" x2="200" y2="65" stroke="#8a8578" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="337" y1="65" x2="375" y2="65" stroke="#8a8578" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="522" y1="65" x2="560" y2="65" stroke="#8a8578" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M632,96 L632,126 L90,126 L90,99" fill="none" stroke="#8a8578" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="361" y="119" font-size="12.5" fill="#8a8578" text-anchor="middle">未达成 → 带着新页面再循环（页面变了，旧观察作废）</text>

  <!-- 观察的两条路线 -->
  <line x1="90" y1="128" x2="90" y2="150" stroke="#8a8578" stroke-width="1.5" marker-end="url(#arr)"/>
  <g font-size="13.5" fill="#45423c" text-anchor="middle">
    <rect x="20" y="154" width="215" height="42" rx="8" fill="#faf8f3" stroke="#e9e4d8"/>
    <text x="127" y="180">结构化：DOM / 无障碍树定位控件</text>
    <rect x="251" y="154" width="215" height="42" rx="8" fill="#faf8f3" stroke="#e9e4d8"/>
    <text x="358" y="180">视觉：截图坐标点击（canvas 等场景）</text>
  </g>

  <!-- 出口三态 -->
  <line x1="632" y1="128" x2="632" y2="150" stroke="#e8590c" stroke-width="2" marker-end="url(#arrO)"/>
  <g font-size="13.5" text-anchor="middle">
    <rect x="482" y="154" width="218" height="42" rx="8" fill="#e8590c"/>
    <text x="591" y="180" fill="#fff">达成 → 核对记录后结束</text>
  </g>
  <g font-size="13.5" fill="#45423c" text-anchor="middle">
    <rect x="20" y="212" width="330" height="42" rx="8" fill="#faf8f3" stroke="#e9e4d8"/>
    <text x="185" y="238">触顶（时间 / 步数 / 成本上限）→ 停止</text>
    <rect x="366" y="212" width="334" height="42" rx="8" fill="#faf8f3" stroke="#e9e4d8"/>
    <text x="533" y="238">登录 / 验证码 / 敏感审批 → 暂停等人</text>
  </g>

  <!-- 三层分工 -->
  <text x="20" y="292" font-size="13" fill="#a39e8f" letter-spacing="2">三层分工 · 不确定性被关在哪一层，要看清</text>
  <g font-size="14" fill="#1d1d1f" text-anchor="middle">
    <rect x="20" y="304" width="215" height="70" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="1.5"/>
    <text x="127" y="330" font-weight="600">模型</text>
    <text x="127" y="354" font-size="12.5" fill="#8a8578">判断下一步（随机性来源）</text>

    <rect x="251" y="304" width="215" height="70" rx="10" fill="#fff" stroke="#d8d2c4" stroke-width="1.5"/>
    <text x="358" y="330" font-weight="600">Harness</text>
    <text x="358" y="354" font-size="12.5" fill="#8a8578">上下文 · 工具 · 循环 · 限额</text>

    <rect x="482" y="304" width="218" height="70" rx="10" fill="#fff" stroke="#d8d2c4" stroke-width="1.5"/>
    <text x="591" y="330" font-weight="600">浏览器</text>
    <text x="591" y="354" font-size="12.5" fill="#8a8578">标签页 · Cookie · 登录态</text>
  </g>

  <!-- 三种承载形态 -->
  <text x="20" y="412" font-size="13" fill="#a39e8f" letter-spacing="2">三种承载形态 · 同一个循环，三种跑法</text>
  <g font-size="13.5" fill="#45423c" text-anchor="middle">
    <rect x="20" y="424" width="215" height="40" rx="8" fill="#faf8f3" stroke="#e9e4d8"/>
    <text x="127" y="449">Python 库：嵌进自己的应用</text>
    <rect x="251" y="424" width="215" height="40" rx="8" fill="#faf8f3" stroke="#e9e4d8"/>
    <text x="358" y="449">CLI：给已有 agent 加浏览器</text>
    <rect x="482" y="424" width="218" height="40" rx="8" fill="#faf8f3" stroke="#e9e4d8"/>
    <text x="591" y="449">全托管 Cloud：连 agent 一起托管</text>
  </g>
</svg>
