<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#F1EBDD"/>
  <text x="600" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#171717">文件系统当通信总线：生产者写文件，消费者按需读</text>
  <!-- Coder -->
  <rect x="40" y="110" width="200" height="90" rx="10" fill="#171717"/>
  <text x="140" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#F1EBDD">Coder</text>
  <text x="140" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#C8F12E">分析 · 写代码</text>
  <!-- Validator -->
  <rect x="40" y="270" width="200" height="90" rx="10" fill="#171717"/>
  <text x="140" y="310" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#F1EBDD">Validator</text>
  <text x="140" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#C8F12E">重算 · 比对</text>
  <!-- Auditor -->
  <rect x="40" y="430" width="200" height="90" rx="10" fill="#171717"/>
  <text x="140" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#F1EBDD">Auditor</text>
  <text x="140" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#C8F12E">审计最终产物</text>
  <!-- Files column -->
  <rect x="330" y="90" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <text x="500" y="127" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#171717">all_results.txt（详细分析结果）</text>
  <rect x="330" y="170" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <text x="500" y="207" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#171717">calculation_metadata.json</text>
  <rect x="330" y="250" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <text x="500" y="287" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#171717">citations.json（已验证引用）</text>
  <rect x="330" y="330" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <text x="500" y="367" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#171717">audit_findings.json（审计发现）</text>
  <rect x="330" y="410" width="340" height="60" rx="10" fill="#8CCFEA" stroke="#171717" stroke-width="2"/>
  <text x="500" y="447" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#171717">coder_analysis_utils.py（公共函数）</text>
  <!-- Reporter -->
  <rect x="960" y="110" width="200" height="90" rx="10" fill="#171717"/>
  <text x="1060" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#F1EBDD">Reporter</text>
  <text x="1060" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#C8F12E">生成 DOCX 报告</text>
  <rect x="960" y="430" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <text x="1060" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#171717">Supervisor</text>
  <text x="1060" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">只收完成消息</text>
  <!-- arrows: coder -> files -->
  <line x1="240" y1="135" x2="330" y2="120" stroke="#171717" stroke-width="2"/>
  <polygon points="330,120 318,114 318,126" fill="#171717"/>
  <line x1="240" y1="160" x2="330" y2="200" stroke="#171717" stroke-width="2"/>
  <polygon points="330,200 318,194 318,206" fill="#171717"/>
  <!-- validator -> citations -->
  <line x1="240" y1="300" x2="330" y2="280" stroke="#171717" stroke-width="2"/>
  <polygon points="330,280 318,274 318,286" fill="#171717"/>
  <!-- auditor -> findings -->
  <line x1="240" y1="460" x2="330" y2="360" stroke="#171717" stroke-width="2"/>
  <polygon points="330,360 318,354 318,366" fill="#171717"/>
  <!-- files -> reporter -->
  <line x1="670" y1="120" x2="960" y2="140" stroke="#171717" stroke-width="2"/>
  <polygon points="960,140 948,134 948,146" fill="#171717"/>
  <line x1="670" y1="280" x2="960" y2="165" stroke="#171717" stroke-width="2"/>
  <polygon points="960,165 948,159 948,171" fill="#171717"/>
  <line x1="670" y1="360" x2="960" y2="175" stroke="#171717" stroke-width="2"/>
  <polygon points="960,175 948,169 948,181" fill="#171717"/>
  <!-- metadata -> validator (read) dashed -->
  <line x1="330" y1="215" x2="240" y2="285" stroke="#F18468" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="240,285 252,279 252,291" fill="#F18468"/>
  <text x="250" y="240" font-family="sans-serif" font-size="14" fill="#F18468">读元数据重算</text>
  <!-- findings -> reporter fix dashed -->
  <line x1="670" y1="370" x2="980" y2="470" stroke="#F18468" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="760" y="440" font-family="sans-serif" font-size="14" fill="#F18468">定向修复（最多 2 次）</text>
  <!-- note -->
  <text x="600" y="548" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">消息只传路径与状态，数据由消费者按需读取；生产者与消费者通过文件解耦</text>
</svg>
