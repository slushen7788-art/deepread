<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="960" height="610" fill="#fbfaf8"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">AutoClean：给 agent 划边界的三阶段删除流水线</text>

  <!-- 阶段1 -->
  <rect x="60" y="66" width="840" height="118" rx="10" fill="#eef4ff" stroke="#b9cdf2"/>
  <text x="84" y="94" font-size="15" font-weight="700" fill="#20509e">阶段 1 · 改写：判断归 agent，化简归确定性引擎</text>
  <g font-size="14" fill="#1f3a5f">
    <rect x="84" y="106" width="392" height="62" rx="7" fill="#ffffff" stroke="#b9cdf2"/>
    <text x="100" y="131">Agent：追踪 flag 值的传播链</text>
    <text x="100" y="154">决定删参数、删分支、测试删还是改</text>
    <rect x="492" y="106" width="384" height="62" rx="7" fill="#ffffff" stroke="#b9cdf2"/>
    <text x="508" y="131">PolyglotPiranha（经 MCP 调用）</text>
    <text x="508" y="154">布尔代数与条件化简——错一点就改变生产行为</text>
  </g>

  <path d="M480 184 L480 208" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 阶段2 -->
  <rect x="60" y="212" width="840" height="118" rx="10" fill="#fff7ea" stroke="#ecd3a3"/>
  <text x="84" y="240" font-size="15" font-weight="700" fill="#8a5a12">阶段 2 · 修 CI：以全仓 CI 为准，修复者权限收窄</text>
  <g font-size="14" fill="#4a3410">
    <rect x="84" y="252" width="392" height="62" rx="7" fill="#ffffff" stroke="#ecd3a3"/>
    <text x="100" y="277">确定性 fixer 先上：删未用默认值、清 lint</text>
    <text x="100" y="300">不认识的失败才往下传</text>
    <rect x="492" y="252" width="384" height="62" rx="7" fill="#ffffff" stroke="#ecd3a3"/>
    <text x="508" y="277">Agentic fixer：只能改授权范围内的文件</text>
    <text x="508" y="300">防它为了让测试变绿去改生产代码 · 循环到全绿</text>
  </g>

  <path d="M480 330 L480 354" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 阶段3 -->
  <rect x="60" y="358" width="840" height="118" rx="10" fill="#eefaf0" stroke="#bfe3c8"/>
  <text x="84" y="386" font-size="15" font-weight="700" fill="#1e6b34">阶段 3 · 验证：静态检查 + CodeCourt 属性评审（每条一个检查者，并行）</text>
  <g font-size="14" fill="#2c4a33">
    <rect x="84" y="398" width="188" height="62" rx="7" fill="#ffffff" stroke="#bfe3c8"/><text x="178" y="435" text-anchor="middle">只删不加</text>
    <rect x="288" y="398" width="188" height="62" rx="7" fill="#ffffff" stroke="#bfe3c8"/><text x="382" y="435" text-anchor="middle">可观察行为不变</text>
    <rect x="492" y="398" width="188" height="62" rx="7" fill="#ffffff" stroke="#bfe3c8"/><text x="586" y="435" text-anchor="middle">不顺手删别的 flag</text>
    <rect x="696" y="398" width="180" height="62" rx="7" fill="#ffffff" stroke="#bfe3c8"/><text x="786" y="435" text-anchor="middle">不留 agent 痕迹</text>
  </g>

  <path d="M480 476 L480 500" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="504" width="840" height="46" rx="10" fill="#f2f2f2" stroke="#d8d8d8"/>
  <text x="480" y="533" text-anchor="middle" font-size="14.5" fill="#333">任一属性不过 → diff 直接丢弃，人看不到 · 全过 → 人只判断「这个 flag 现在该不该删」</text>

  <text x="480" y="584" text-anchor="middle" font-size="13.5" fill="#888">Uber 自报多年累计：16,000+ 个 flag、1,000,000+ 行代码（无丢弃率、驳回率等分母）</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#999"/>
    </marker>
  </defs>
</svg>
