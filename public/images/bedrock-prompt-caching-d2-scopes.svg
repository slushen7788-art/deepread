<svg xmlns="http://www.w3.org/2000/svg" width="880" height="265" viewBox="0 0 880 265">
<rect width="880" height="265" fill="#fdf6ec"/>
<g font-family="sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#888"/></marker></defs><rect x="40" y="30" width="380" height="150" rx="10" fill="#ffe1b8" stroke="#d99a4e"/><text x="230" y="60" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">第一层：稳定的启动上下文</text><text x="230" y="88" font-size="14" text-anchor="middle" fill="#555">工具定义、业务政策</text><text x="230" y="112" font-size="14" text-anchor="middle" fill="#555">版本与内容一致时</text><text x="230" y="136" font-size="14" text-anchor="middle" fill="#555">不同任务共享同一前缀</text><text x="230" y="162" font-size="14" text-anchor="middle" fill="#555">显式断点标记</text><rect x="460" y="30" width="380" height="150" rx="10" fill="#d8ecff" stroke="#6a9fd8"/><text x="650" y="60" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">第二层：单次任务的执行历史</text><text x="650" y="88" font-size="14" text-anchor="middle" fill="#555">工单查询 → 订单状态 → 处理建议</text><text x="650" y="112" font-size="14" text-anchor="middle" fill="#555">链内逐步累积</text><text x="650" y="136" font-size="14" text-anchor="middle" fill="#555">未变化部分滚动复用</text><text x="650" y="162" font-size="14" text-anchor="middle" fill="#555">隐式缓存跟进</text><text x="440" y="215" font-size="14" text-anchor="middle" fill="#8a6d3b">只设显式断点、不处理历史 → 新增历史仍被反复计算</text><text x="440" y="240" font-size="14" text-anchor="middle" fill="#8a6d3b">只靠隐式、边界落在变化任务后 → 新任务难复用完整前缀</text></g>
</svg>