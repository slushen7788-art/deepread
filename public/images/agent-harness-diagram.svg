<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
<rect width="880" height="330" fill="#fdf6ec"/>
<g font-family="sans-serif">
<text x="440" y="38" font-size="23" font-weight="bold" text-anchor="middle" fill="#222">Agent = Model + Harness</text>
<rect x="40" y="65" width="250" height="84" rx="10" fill="#ffffff" stroke="#bbb"/>
<text x="165" y="93" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Model · 模型</text>
<text x="165" y="117" font-size="14" text-anchor="middle" fill="#555">推理 · 决策 · 生成</text>
<text x="165" y="139" font-size="14" text-anchor="middle" fill="#555">只管想，不直接兜底</text>
<rect x="315" y="65" width="250" height="84" rx="10" fill="#ffe1b8" stroke="#d99a4e"/>
<text x="440" y="93" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Harness · 工程系统</text>
<text x="440" y="117" font-size="14" text-anchor="middle" fill="#555">状态持久 · 沙箱隔离 · 权限校验</text>
<text x="440" y="139" font-size="14" text-anchor="middle" fill="#555">轨迹观测 · 评估校验 · 强制审批</text>
<rect x="590" y="65" width="250" height="84" rx="10" fill="#ffffff" stroke="#bbb"/>
<text x="715" y="93" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">公共承载层 · Agentic OS</text>
<text x="715" y="117" font-size="14" text-anchor="middle" fill="#555">调度 · 授权 · 审计 · 快照</text>
<text x="715" y="139" font-size="14" text-anchor="middle" fill="#555">跨应用通用，不碰任务语义</text>
<text x="440" y="185" font-size="15" text-anchor="middle" fill="#444">形态谱系不是升级链，是两个独立维度：时间跨度 × 协作结构</text>
<text x="440" y="213" font-size="15" text-anchor="middle" fill="#444">先把边界清晰的单智能体跑稳，受限于上下文、权限、角色复杂度时再加复杂度</text>
<text x="440" y="249" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">L4 是规模化运营状态，不是新形态：单智能体也可以落在 L4</text>
<text x="440" y="285" font-size="14" text-anchor="middle" fill="#777">选型看风险匹配的最低充分架构，不是追 Multi-Agent 或者长时任务</text>
</g>
</svg>