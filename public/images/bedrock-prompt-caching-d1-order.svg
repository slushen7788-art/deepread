<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390">
<rect width="880" height="390" fill="#fdf6ec"/>
<g font-family="sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#888"/></marker></defs><rect x="60" y="30" width="760" height="84" rx="10" fill="#ffe1b8" stroke="#d99a4e"/><text x="440" y="60" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">1 · 相对稳定的指令和工具定义</text><text x="440" y="84" font-size="14" text-anchor="middle" fill="#555">可复用前缀 · 显式断点标在这里 · 前缀至少 1,024 Token</text><line x1="440" y1="114" x2="440" y2="138" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="138" width="760" height="84" rx="10" fill="#d8ecff" stroke="#6a9fd8"/><text x="440" y="168" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">2 · 历史对话与工具结果</text><text x="440" y="192" font-size="14" text-anchor="middle" fill="#555">随任务推进增长 · 滚动断点跟进</text><line x1="440" y1="222" x2="440" y2="246" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="246" width="760" height="84" rx="10" fill="#ffffff" stroke="#bbb"/><text x="440" y="276" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">3 · 本轮变化的任务内容</text><text x="440" y="300" font-size="14" text-anchor="middle" fill="#555">每轮都不同 · 放在缓存边界之后，只处理不缓存</text><text x="440" y="360" font-size="14" text-anchor="middle" fill="#8a6d3b">动态字段（日期、用户名、请求 ID）一律放在稳定前缀之后，混进前缀就破坏命中</text></g>
</svg>